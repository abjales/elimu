# OpenMAIC Classroom - HTTPS via Let's Encrypt (certbot --nginx manages the cert lines)
# Deploy: cp this to /etc/nginx/sites-available/app.hatronsolutions.com,
#         ln -s ../sites-available/app.hatronsolutions.com /etc/nginx/sites-enabled/,
#         then: certbot --nginx -d app.hatronsolutions.com --non-interactive --agree-tos -m you@example.com
# certbot auto-inserts the ssl_certificate / ssl_certificate_key lines into the 443 block.

# Upstream for OpenMAIC Classroom
upstream openmaic {
    server 127.0.0.1:3001;
    keepalive 32;
}

# HTTP :80 — only used for the ACME challenge + redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name app.hatronsolutions.com;

    # Let's Encrypt HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else -> HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS :443
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.hatronsolutions.com;

    # Certbot will inject these two lines after the first successful issuance:
    # ssl_certificate /etc/letsencrypt/live/app.hatronsolutions.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/app.hatronsolutions.com/privkey.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    client_max_body_size 50M;

    # Static assets
    location /_next/static/ {
        proxy_pass http://openmaic;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Main app + API (proxy everything to openmaic :3001)
    location / {
        proxy_pass http://openmaic;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # SSE / streaming (classroom generation) must not buffer
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Deny hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
